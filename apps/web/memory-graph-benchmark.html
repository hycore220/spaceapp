<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory graph synthetic benchmark</title>
<style>body{margin:0;background:#09111b;color:#c6dfed;font:14px system-ui}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px}main{position:relative;height:70vh;margin:0 16px;border:1px solid #385068}canvas{width:100%;height:100%;display:block;touch-action:none}#labels{position:absolute;inset:0;pointer-events:none}pre{white-space:pre-wrap;margin:16px}#state{padding:0 16px}canvas:focus{outline:2px solid #57ccff}</style></head><body>
<header><strong>Synthetic memory graph</strong><label>Nodes <select id="size"><option>2000</option><option>10000</option><option>50000</option></select></label><button id="load">Load</button><button id="titles">Titles: on</button><button id="benchmark">Measure 240 frames</button><button id="context">Lose / restore context</button></header>
<p id="state" role="status">Ready. No backend or personal data. Drag / arrow keys rotate; scroll / +/- zoom; hover and click select.</p>
<main><canvas id="graph" tabindex="0" role="application" aria-label="Synthetic 3D memory graph" aria-busy="true"></canvas><canvas id="labels" aria-hidden="true"></canvas></main><pre id="result">No performance measurement yet. This machine does not establish integrated-GPU laptop eligibility.</pre>
<script type="module" src="/src/features/memory-workspace/memory-graph-benchmark.ts"></script></body></html>
